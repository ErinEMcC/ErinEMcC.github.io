<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Art / Work</title>
  <style>
  
    
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 700px 700px;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 0.5rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    .navbar img {
      height: 50px;
      width: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .navbar img:hover {
      transform: scale(1.1);
    }

        /* --- MOSAIC WALL ish*/
    .frame-wall{
      column-count: 3;
      column-gap: 1.2rem;
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    
    /* each item becomes a “tile” that flows into columns */
    .frame{
      break-inside: avoid;
      margin: 0 0 1.2rem;
      display: inline-block;
      width: 100%;
      position: relative;
      transform: rotate(calc((var(--tilt, 0) * 1deg)));
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    
    /* remove the literal frame + label vibes */
    .frame img{
      width: 100%;
      display: block;
      border: none;          /* no frame */
      border-radius: 10px;   /* optional: soft edge (set 0 if you want raw) */
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    
    /* hide captions entirely */
    .caption{ display: none; }
    
    /* subtle hover: “alive” but not gallery-like */
    .frame:hover{
      transform: rotate(calc((var(--tilt, 0) * 1deg))) scale(1.02);
      z-index: 2;
    }
    
    .frame:hover img{
      filter: brightness(1.05) contrast(1.02);
    }
    
    @media (max-width: 900px){
      .frame-wall{ column-count: 2; }
    }
    
    @media (max-width: 550px){
      .frame-wall{ column-count: 1; }
}


    .works {
      max-width: 800px;
      margin: 2rem auto;
      background: rgba(255,255,255,0.85);
      padding: 1rem;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .works ul {
      margin-top: 0.5rem;
      padding-left: 1.2rem;
    }

    @media (max-width: 900px) {
      .frame-wall {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .frame-wall {
        grid-template-columns: 1fr;
      }
    }

    
  </style>
</head>
<body>

  <div class="frame-wall">
    <div class="frame" style="--tilt:-2;">
      <a href="https://erinemcc.github.io/giraffe-fidl.html" target="_blank">
        <img src="images/fidl-comic.png" alt="FIDL Comic Book">
        <div class="caption">The Familiar Impossible</div>
      </a>
    </div>
    
  <div class="frame" style="--tilt:1;">
      <a href="https://erinemcc.github.io/fieldguide.html" target="_blank">
        <img src="images/fieldGuide.png" alt="Field Guide">
        <div class="caption">Field Guide to Disappearing Acts</div>
      </a>
    </div>

  <div class="frame" style="--tilt:-1;">
      <a href="https://erinemcc.github.io/cope.html" target="_blank">
        <img src="images/cope.jpg" alt="CoPE Project">
        <div class="caption">The CoPE Project</div>
      </a>
    </div>
    
    <div class="frame">
      <a href="https://erinemcc.github.io/aunt-rita.html" target="_blank">
        <img src="images/aunt-bison.png" alt="Aunt Rita Short Story">
        <div class="caption">Aunt Rita</div>
      </a>
    </div>
    
<div class="frame" style="--tilt:-2;">
      <a href="https://erinemcc.github.io/skunk-and-bear.html" target="_blank">
        <img src="images/bear_listen.png" alt="Skunk and Bear Short Story">
        <div class="caption">Skunk & Bear</div>
      </a>
    </div>
     
    <div class="frame">
      <a href="https://erinemcc.github.io/dog-star.html" target="_blank">
        <img src="images/dog_fade.png" alt="Dog Star">
        <div class="caption">Dog Star</div>
      </a>
    </div>
    
  </div>

  

</body>
</html>
