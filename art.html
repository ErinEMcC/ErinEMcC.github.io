<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work / Art</title>

<style>
  body{
    margin: 0;
    font-family: Georgia, serif;
    background: url('assets/transparency-grid.jpg') repeat;
    background-size: 700px 700px;
    display: flex;
    flex-direction: column;    
  }

  /* --- GALLERY GRID --- */
  .gallery{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    grid-auto-rows: 10px;
    max-width: 1100px;
    margin: 4rem auto;
    padding: 0 1rem;
  }

  .tile{
    overflow: hidden;
    border-radius: 12px; /* remove or reduce if you want sharper */
  }

  .tile img{
    width: 100%;
    display: block;
    height: auto;
  }

  /* optional featured tile */
  .featured{
    grid-column: span 2;
  }

  /* responsive */
  @media (max-width: 900px){
    .gallery{
      grid-template-columns: repeat(2, 1fr);
    }
    .featured{
      grid-column: span 2;
    }
  }

  @media (max-width: 550px){
    .gallery{
      grid-template-columns: 1fr;
    }
    .featured{
      grid-column: span 1;
    }
  }
</style>
</head>

<body>

<div class="gallery">
  <div class="tile featured">
    <img src="images/fidl-comic.png" alt="">
  </div>

  <div class="tile">
    <img src="images/fieldGuide.png" alt="">
  </div>

  <div class="tile">
    <img src="images/cope.jpg" alt="">
  </div>

  <div class="tile">
    <img src="images/aunt-bison.png" alt="Aunt Rita Short Story">
  </div>

  <div class="tile">
    <img src="images/bear_listen.png" alt="Skunk and Bear Short Story">
  </div>

  <div class="tile">
    <img src="images/dog_fade.png" alt="Dog Star">
  </div>
  
</div>

<script>
  function resizeMasonryItem(item){
    const grid = document.querySelector('.gallery');
    if (!grid) return;

    const rowGap = parseInt(getComputedStyle(grid).gap) || 0;
    const rowHeight = parseInt(getComputedStyle(grid).getPropertyValue('grid-auto-rows')) || 10;

    // use scrollHeight so it reflects the true content height once images load
    const itemHeight = item.scrollHeight;
    const rowSpan = Math.ceil((itemHeight + rowGap) / (rowHeight + rowGap));
    item.style.gridRowEnd = `span ${Math.max(1, rowSpan)}`;
  }

  function resizeAllMasonryItems(){
    document.querySelectorAll('.tile').forEach(resizeMasonryItem);
  }

  function bindMasonry(){
    const imgs = document.querySelectorAll('.tile img');

    // Run immediately (so you get *something*)…
    resizeAllMasonryItems();

    // …then run again as each image loads OR errors
    imgs.forEach(img => {
      const rerun = () => resizeAllMasonryItems();
      img.addEventListener('load', rerun, { once: true });
      img.addEventListener('error', rerun, { once: true });
    });

    // And one more pass shortly after (handles slow layout/font timing)
    setTimeout(resizeAllMasonryItems, 150);
    setTimeout(resizeAllMasonryItems, 600);
  }

  window.addEventListener('load', bindMasonry);
  window.addEventListener('resize', () => {
    clearTimeout(window.__masonryTimer);
    window.__masonryTimer = setTimeout(resizeAllMasonryItems, 100);
  });
</script>


</body>
</html>
