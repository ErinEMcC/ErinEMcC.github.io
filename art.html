<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>art shmart</title>

<style>
  body{
    margin: 0;
    font-family: Georgia, serif;
    background: url('assets/transparency-grid.jpg') repeat;
    background-size: 700px 700px;
    display: flex;
    flex-direction: column;    
  }

  /* --- GALLERY GRID --- */
.gallery{
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  grid-auto-rows: clamp(425px, 28vw, 900px);


  /* more landscape / less side margin */
  width: min(1400px, 95vw);
  margin: 2.5rem auto;
  padding: 0;
}

.tile{
  overflow: hidden;
}

.tile img{
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* --- Layout to match your PNG exactly --- */
/* 1: spans cols 1–2 on row 1 */
.tile:nth-child(1){
  grid-column: 1 / span 2;
  grid-row: 1;
}

/* 2 (Field Guide): tall, col 3, spans rows 1–2 */
.tile:nth-child(2){
  grid-column: 3;
  grid-row: 1 / span 2;
}

/* 3: top-right (col 4 row 1) */
.tile:nth-child(3){
  grid-column: 4;
  grid-row: 1;
}

/* 4: bottom-left (col 1 row 2) */
.tile:nth-child(4){
  grid-column: 1;
  grid-row: 2;
}

/* 5: bottom-middle-left (col 2 row 2) */
.tile:nth-child(5){
  grid-column: 2;
  grid-row: 2;
}

/* 6: bottom-right (col 4 row 2) */
.tile:nth-child(6){
  grid-column: 4;
  grid-row: 2;
}

/* Give the whole grid a nice “two rows” shape */
.tile:nth-child(2){ grid-row: 1 / span 2; } /* ensures tall tile */

/* --- Responsive: collapse nicely --- */
@media (max-width: 950px){
  .gallery{
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 220px;
  }

  /* stack in a simple order */
  .tile:nth-child(1){ grid-column: 1 / -1; grid-row: auto; }
  .tile:nth-child(2){ grid-column: 1 / -1; grid-row: auto; }
  .tile:nth-child(3),
  .tile:nth-child(4),
  .tile:nth-child(5),
  .tile:nth-child(6){ grid-column: auto; grid-row: auto; }
}

@media (max-width: 560px){
  .gallery{ grid-template-columns: 1fr; }
}

</style>
</head>

<body>

<div class="gallery">
  <div class="tile">
    <a href="https://erinemcc.github.io/giraffe-fidl.html" data-title="Familiar Impossible">
    <img src="images/fidl-comic.png" alt="FiDL Co.">
    </a>
  </div>

  <div class="tile">
  <a href="https://erinemcc.github.io/field-guide.html" data-title="Field Guide">
    <img src="images/fieldGuide.png" alt="Field Guide">
  </a>
</div>

  <div class="tile">
    <a href="https://erinemcc.github.io/cope.html" data-title="Collaborative Poetry Experiment">
    <img src="images/cope.jpg" alt="">
    </a>
  </div>

  <div class="tile">
    <a href="https://erinemcc.github.io/aunt-rita.html" data-title="Aunt Rita">
    <img src="images/aunt-bison.png" alt="Aunt Rita Short Story">
    </a>
  </div>

  <div class="tile">
    <a href="https://erinemcc.github.io/dog-star.html" data-title="Dog Star">
  <img src="images/dog_fade.png" alt="Dog Star">
   </a>
</div>


  <div class="tile">
    <a href="https://erinemcc.github.io/skunk-and-bear.html" data-title="Skunk and Bear">
    <img src="images/bear_listen.png" alt="Skunk and Bear Short Story">
     </a>
  </div>
  
</div>

</body>
</html>
