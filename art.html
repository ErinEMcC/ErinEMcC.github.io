<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work / Art</title>

<style>
  body{
    margin: 0;
    font-family: Georgia, serif;
    background: url('assets/transparency-grid.jpg') repeat;
    background-size: 700px 700px;
    display: flex;
    flex-direction: column;    
  }

  /* --- GALLERY GRID --- */
 .gallery{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0px;              /* space between tiles */
  grid-auto-rows: 10px;   /* IMPORTANT: must not be 0 */
  max-width: 1100px;
  margin: 4rem auto;
  padding: 0 1rem;
}


  .tile{
  overflow: hidden;
}

  /* constrain tile height + crop  */
  .tile img{
    width: 100%;
    height: clamp(180px, 32vw, 420px); /* min, fluid, max */
    object-fit: cover;                 /* crop instead of stretch */
    display: block;
  }

  .tile:nth-child(5) img{
  height: clamp(260px, 45vw, 680px); /* taller “hero” */
}

  /* optional featured tile */
  .featured{
    grid-column: span 2;
  }

  .manual-span{
  grid-row-end: span 70; /* taller tile */
}

  .tile a{
  position: relative;
  display: block;
}

.tile a::after{
  content: attr(data-title);
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 0.85rem;
  border-radius: 6px;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

.tile a:hover::after{
  opacity: 1;
  transform: translateY(0);
}


  
  /* responsive */
  @media (max-width: 900px){
    .gallery{
      grid-template-columns: repeat(2, 1fr);
    }
    .featured{
      grid-column: span 2;
    }
  }

  @media (max-width: 550px){
    .gallery{
      grid-template-columns: 1fr;
    }
    .featured{
      grid-column: span 1;
    }
  }
</style>
</head>

<body>

<div class="gallery">
  <div class="tile featured">
    <a href="https://erinemcc.github.io/giraffe-fidl.html" data-title="Familiar Impossible">
    <img src="images/fidl-comic.png" alt="FiDL Co.">
    </a>
  </div>

  <div class="tile">
  <a href="https://erinemcc.github.io/field-guide.html" data-title="Field Guide">
    <img src="images/fieldGuide.png" alt="Field Guide">
  </a>
</div>

  <div class="tile">
    <a href="https://erinemcc.github.io/cope.html" data-title="Collaborative Poetry Experiment">
    <img src="images/cope.jpg" alt="">
    </a>
  </div>

  <div class="tile">
    <a href="https://erinemcc.github.io/aunt-rita.html" data-title="Aunt Rita">
    <img src="images/aunt-bison.png" alt="Aunt Rita Short Story">
    </a>
  </div>

  <div class="tile manual-span">
    <a href="https://erinemcc.github.io/dog-star.html" data-title="Dog Star">
  <img src="images/dog_fade.png" alt="Dog Star">
   </a>
</div>


  <div class="tile">
    <a href="https://erinemcc.github.io/skunk-and-bear.html" data-title="Skunk and Bear">
    <img src="images/bear_listen.png" alt="Skunk and Bear Short Story">
     </a>
  </div>
  
</div>

<script>
  function resizeMasonryItem(item){
    const grid = document.querySelector('.gallery');
    if (!grid) return;

    const rowGap = parseInt(getComputedStyle(grid).gap) || 0;
    const rowHeight = parseInt(getComputedStyle(grid).getPropertyValue('grid-auto-rows')) || 10;

    // use scrollHeight so it reflects the true content height once images load
    const itemHeight = item.scrollHeight;
    const rowSpan = Math.ceil((itemHeight + rowGap) / (rowHeight + rowGap));
    item.style.gridRowEnd = `span ${Math.max(1, rowSpan)}`;
  }

  function resizeAllMasonryItems(){
    document.querySelectorAll('.tile').forEach(resizeMasonryItem);
  }

  function bindMasonry(){
    const imgs = document.querySelectorAll('.tile img');

    // Run immediately (so you get *something*)…
    resizeAllMasonryItems();

    if (item.classList.contains('manual-span')) return;


    // …then run again as each image loads OR errors
    imgs.forEach(img => {
      const rerun = () => resizeAllMasonryItems();
      img.addEventListener('load', rerun, { once: true });
      img.addEventListener('error', rerun, { once: true });
    });

    // And one more pass shortly after (handles slow layout/font timing)
    setTimeout(resizeAllMasonryItems, 150);
    setTimeout(resizeAllMasonryItems, 600);
  }

  window.addEventListener('load', bindMasonry);
  window.addEventListener('resize', () => {
    clearTimeout(window.__masonryTimer);
    window.__masonryTimer = setTimeout(resizeAllMasonryItems, 100);
  });
</script>


</body>
</html>
