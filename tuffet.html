<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/tuffet.css" />
  <title>RiTa Cover Letter</title>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://rednoise.org/rita/rita.js"></script>
</head>
<body>
  <div class="container">
    <div id="output">Loading...</div>
    <div id="reload">
      <button onclick="generatePrompt()">Read New Cover Letter</button>
    </div>
  </div>

  <script>
    // lists you had before
    const jobs = ["librarian", "Voltarian", "maker-ian", "contrarian", "riparian"];
    const verbs = ["drinking", "writing", "reading", "making", "thinking"];
    const gizmos = ["bits and bobs", "odds and ends", "bric a brac", "stuff and things"];
    const nouns = ["plan", "letter", "story", "document", "recipe"];
    const jjs = ["chic", "shrewd", "swamp", "dream", "sane", "slick", "lithe", "lush", "brash", "curt", "damned", "coy", "calm", "crisp", "dark", "blue", "green", "fast", "fresh", "grand", "huge", "kind", "rough", "sharp", "short", "smart", "smooth", "strong","sweet", "tough"]
                 
    // helper
    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    async function loadAnimals() {
      const response = await fetch("./data/animals.json");
      return await response.json();
    }

    async function generatePrompt() {
      const animals = await loadAnimals();

      // slots:
      const name = "Erin";
      const job = pick(jobs);
      const verb = pick(verbs);
      const gizmo = pick(gizmos);
      const adjective = pick(jjs);
      const animal = pick(animals);
      const noun = pick(nouns);

      const lines = [
        `<h2>My name is ${name}</h2>`,
        `I'm a ${job}`,
        `${verb} my ${gizmo}`,
        `There came a ${adjective} ${animal}`,
        `with a secret ${noun}`,
        `And frightened Miss Muffet away.`
      ];

      $("#output").html(lines.join("<br>"));
    }

    document.addEventListener("DOMContentLoaded", generatePrompt);
  </script>
</body>
</html>
