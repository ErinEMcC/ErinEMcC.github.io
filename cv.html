<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum Vitae</title>

  <!-- TUFFET css (use your existing file) -->
  <link rel="stylesheet" href="css/tuffet.css" />

  <!-- libs for TUFFET -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://rednoise.org/rita/rita.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 700px 700px;
      font-family: sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* NEW: 2-column layout */
    .layout {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1vw;          
      padding: 4vh 4vw;
      box-sizing: border-box;
    }

        /* Right side holds two "pages" */
    .docs{
      flex: 1;
      width: auto;                
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: clamp(8px, 1vw, 16px);
      align-items: center;
      justify-items: center;
      margin-left: 3vw;
    }



    /* Left: Tuffet panel */
    .tuffet-panel {
      flex: 0 0 26%;
      min-width: 280px;
      max-width: 420px;
      height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    
      background: rgba(255,255,255,0.92);
      border-radius: 0px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      padding: 1.25rem 1.25rem 1.5rem;
      box-sizing: border-box;
    }

    /* Match your existing tuffet container structure */
    .tuffet-panel .container {
      width: 100%;
      margin: 0;
    }

    /* Right: CV/portfolio page container  */
    .page-container {
      flex: 1;                
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-wrapper{
      position: relative;
      height: 85vh;            
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .page{
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
      display: block;
    }


    @keyframes openPage {
      to { transform: rotateY(0deg); }
    }

    .download-image-button{
      position: absolute;
      right: 2.5%;
      bottom: 2.5%;
      height: auto;
      width: clamp(50px, 20%, 120px); /* relative to wrapper width */
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 10;
    }


    .download-image-button:hover { transform: scale(1.05); }
    .download-image-button:active {
      transform: scale(0.97) translateY(2px);
      filter: brightness(0.95);
    }

    /* Responsive: stack on small screens */
    @media (max-width: 900px) {
      body { overflow: auto; height: auto; }
      .layout {
        height: auto;
        flex-direction: column;
        align-items: center;
      }
      .tuffet-panel, .docs {
        width: min(92vw, 1000px);
        height: auto;
      }
      
      .docs{
        flex: 1;                   
        display: flex;
        gap: 1vw;                   
        align-items: center;
        justify-content: center;
      }

      .page-container {
        flex: 1;                    
        max-width: 540px;           
        perspective: 1000px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .page { height: auto; width: 100%; max-height: 85vh; }
      .download-image-button {
        width: clamp(44px, 22%, 110px);
      }
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- LEFT: TUFFET -->
    <aside class="tuffet-panel">
      <div class="tuffet-inner">
      <div id="output" class="tuffet-poem">Loading...</div>
    
      <div class="tuffet-controls">
        <button onclick="generatePrompt()">Read New Cover Letter</button>
        <button onclick="downloadCoverLetter()" class="download-btn">Download Cover Letter</button>
      </div>
      </div>
    </aside>

    <!-- RIGHT: DOCUMENTS (CV + Portfolio) -->
<div class="docs">
  <!-- CV -->
  <div class="page-container">
    <div class="page-wrapper">
      <img src="assets/cv.png" alt="CV Preview" class="page">
      <a href="assets/cv.pdf" download>
        <img src="assets/download-button.png" alt="Download CV" class="download-image-button">
      </a>
    </div>
  </div>

  <!-- Portfolio -->
  <div class="page-container">
    <div class="page-wrapper">
      <img src="assets/portfolio-cover.png" alt="Portfolio Cover" class="page">
      <a href="assets/portfolio.pdf" download>
        <img src="assets/download-button.png" alt="Download Portfolio" class="download-image-button">
      </a>
    </div>
  </div>
</div>


  <!-- TUFFET JS (your working file) -->
  <script src="js/tuffet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.generatePrompt) window.generatePrompt();
    });
  </script>
</body>
</html>
