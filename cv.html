<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curriculum Vitae</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: cover;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .page-container {
      margin-top: 5vh;
      width: 80%;
      max-width: 800px;
      perspective: 1000px;
    }

    .page {
      width: 100%;
      transform-origin: left center;
      transform: rotateY(-90deg);
      animation: openPage 1.2s forwards ease-out;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    @keyframes openPage {
      to {
        transform: rotateY(0deg);
      }
    }

    .download-image-button {
      margin-top: 20px;
      width: 180px; /* adjust size as needed */
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    
    .download-image-button:hover {
      transform: scale(1.05);
    }

    .bottom-border {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: url('assets/jungle2-border.png') no-repeat center bottom;
      background-size: cover;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <img src="assets/cv-p1.jpg" alt="CV Preview" class="page">
    <a href="assets/cv-mccabe.pdf" download>
        <img src="assets/button-downloadcv.png" alt="Download CV" class="download-image-button">
    </a>
  </div>

  <div class="bottom-border"></div>

</body>
</html>
