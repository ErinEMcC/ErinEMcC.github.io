<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoPE</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 300px 300px;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 5vh 0;
      box-sizing: border-box;
    }

    .pdf-shell {
      width: min(1000px, 92vw);
      height: 85vh;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .fallback {
      width: min(1000px, 92vw);
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      padding: 14px 16px;
      box-sizing: border-box;
      font-size: 0.95rem;
      color: #2d2d2d;
    }

    .fallback a {
      color: #1a4fb3;
      text-decoration: none;
      border-bottom: 1px solid rgba(26,79,179,0.35);
    }
    .fallback a:hover { border-bottom-color: rgba(26,79,179,0.9); }

    /* ===== Floating sidequest button ===== */
    .random-nav-btn {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 9999;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    }

    .random-nav-btn img {
      width: 105px;
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 160ms ease;
    }

    .random-nav-btn img:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .random-nav-btn img:active {
      transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .random-nav-btn img { transition: none; }
    }
  </style>
</head>

<body>

  <!-- Floating sidequest button -->
  <a href="#" class="random-nav-btn" id="randomNavBtn" aria-label="Sidequest" title="maybe?">
    <img src="assets/sidequest.png" alt="Sidequest">
  </a>

  <div class="pdf-shell" aria-label="CoPE PDF viewer">
    <iframe
      class="pdf-frame"
      src="assets/TheFieldGuide.pdf#view=FitH"
      title="The Snell Field Guide to Disappearing Acts for Girls & Giraffes"
      loading="lazy">
    </iframe>
  </div>

  <div class="fallback">
    If the PDF doesn’t show up here (which sometimes can happen on certain phones), open it directly:
    <a href="assets/TheFieldGuide.pdf" target="_blank" rel="noopener">
      The Snell Field Guide to Disappearing Acts for Girls & Giraffes PDF
    </a>
  </div>

  <script>
    const randomUrls = [
      "https://erinemcc.github.io/aunt-rita.html",
      "https://erinemcc.github.io/bee-umwelt.html",
      "https://erinemcc.github.io/dog-star.html",
      "https://erinemcc.github.io/unicorns.html",
      "https://erinemcc.github.io/giraffe-fidl.html",
      "https://erinemcc.github.io/skunk-and-bear.html",
      "https://erinemcc.github.io/cv.html",
      "https://erinemcc.github.io/research.html"
      "https://erinemcc.github.io/cope.html"
    ];

    const btn = document.getElementById("randomNavBtn");
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const i = Math.floor(Math.random() * randomUrls.length);
      window.location.href = randomUrls[i];
    });
  </script>

</body>
</html>
