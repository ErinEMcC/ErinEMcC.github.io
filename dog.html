<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/background-texture.jpg') repeat;
      background-size: cover;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 5vh 0;
      box-sizing: border-box;
    }

    .video-container {
      width: 80vw;
      max-width: 1000px;
      position: relative;
      padding-top: 56.25%; /* 16:9 aspect ratio */
      margin-bottom: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    .caption {
      color: #2d2d2d;
      font-size: 1rem;
      text-align: center;
      max-width: 80vw;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.85);
      padding: 1rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Option A: Local video -->
    <video controls autoplay muted playsinline>
      <source src="assets/your-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- Option B: YouTube embed (uncomment if using this instead) -->
    <!--
    <iframe src="https://www.youtube.com/embed/VIDEO_ID_HERE" frameborder="0" allowfullscreen></iframe>
    -->
  </div>

  <div class="caption">
    <p><strong>“The Leaves Remember”</strong></p>
    <p>This short video captures a quiet moment at the edge of the jungle — where something old stirs with each rustle of wind.</p>
  </div>

</body>
</html>
