<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Steganography</title>
 
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 600px 600px;        
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 0.5rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    .navbar img {
      height: 50px;
      width: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .navbar img:hover {
      transform: scale(1.1);
    }
    
    .frame-container {
      position: relative;
      background-image: url('assets/frame-blue.png');
      background-size: contain;
      background-repeat: no-repeat;
      width: 66vw; 
      aspect-ratio: 994 / 720; 
    }

    .secret-image {
      position: absolute;
      top: 19%;
      left: 15%;
      width: 69%;
      height: 61%;
      object-fit: contain;
      cursor: pointer;
    }

    .gallery-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 12px;
      font-family: sans-serif;
      font-size: 16px;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <a href="assets/secretDesktop.png" download>
      <img src="assets/secretDesktop.png" alt="Secret" class="secret-image">
    </a>
    <div class="gallery-tag">
      Secret Desktop<br>
      - Click & download png for more secrets<br>
      - Upload the png into a hex editor (tip: use the pdf signature)<br>
      - Or decode the Caesar Cipher<br>
    </div>
  </div>
</body>
</html>
