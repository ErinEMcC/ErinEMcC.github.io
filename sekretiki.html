<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Locked Page</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('images/pedvale_field.png') center center fixed;
      background-size: cover;
      font-family: Georgia, serif;
      color: black;
      position: relative;
    }  
    
    #lock-screen {
      position: absolute;
      bottom: 18vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .word-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 14px 0;
    }

    input {
      width: 120px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid black;
      background: white;
      color: black;
      text-align: center;
      outline: none;
    }

    button {
      padding: 10px 18px;
      font-size: 1.4rem;
      border: 1px solid black;
      background: white;
      color: black;
      cursor: pointer;
    }

    button:hover {
      background: black;
      color: white;
    }

    #secret-page {
      display: none;
      max-width: 700px;
      padding: 40px;
      line-height: 1.6;
    }

    #error {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div id="lock-screen">
    <div>what 3 words?</div>

    <div class="word-row">
      <input id="word1" type="text">
      <input id="word2" type="text">
      <input id="word3" type="text">
    </div>

    <button onclick="checkWords()">🪏</button>

    <div id="error"></div>
  </div>

  <div id="secret-page">
    <h1>The Hidden Page</h1>

    <p>
      This appears after the words are entered..blablabla.
    </p>

    <p>
      Replace this.
    </p>
  </div>

  <script>
    function checkWords() {
      const correct1 = "green";
      const correct2 = "dog";
      const correct3 = "day";

      const word1 = document.getElementById("word1").value.trim().toLowerCase();
      const word2 = document.getElementById("word2").value.trim().toLowerCase();
      const word3 = document.getElementById("word3").value.trim().toLowerCase();

      if (
        word1 === correct1 &&
        word2 === correct2 &&
        word3 === correct3
      ) {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("secret-page").style.display = "block";
      } else {
        document.getElementById("error").textContent =
          "No secrets for you!";
      }
    }
  </script>

</body>
</html>
