<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Star</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: cover;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 5vh 0;
      box-sizing: border-box;
    }

    .video-container {
      width: 75vw;
      max-width: 1000px;
      position: relative;
      padding-top: 56.25%;
      margin-bottom: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .caption {
      color: #2d2d2d;
      font-size: 1rem;
      text-align: center;
      max-width: 80vw;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.85);
      padding: 1rem;
      border-radius: 10px;
    }

    /* ===== Floating sidequest button ===== */
    .random-nav-btn {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 9999;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    }

    .random-nav-btn img {
      width: 105px; /* match your other page */
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 160ms ease;
    }

    .random-nav-btn img:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .random-nav-btn img:active {
      transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .random-nav-btn img {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <!-- Floating sidequest button -->
  <a href="#" class="random-nav-btn" id="randomNavBtn" aria-label="Sidequest" title="sidequest?">
    <img src="assets/sidequest.png" alt="Sidequest">
  </a>

  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/CNAYEzjzhEU?si=OH4dR5kglD7UIFFn"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
  </div>

  <div class="caption">
    <p><strong>Dog Star</strong></p>
    <p>A video-memory of a wannabe-Ramona Quimby childhood and some of the things that can be real when you are still figuring out what real is.</p>
  </div>

  <script>
    const randomUrls = [
      "https://erinemcc.github.io/aunt-rita.html",
      "https://erinemcc.github.io/bee-umwelt.html",
      "https://erinemcc.github.io/giraffe-fidl.html",
      "https://erinemcc.github.io/unicorns.html",
      "https://erinemcc.github.io/cope.html",
      "https://erinemcc.github.io/skunk-and-bear.html",
      "https://erinemcc.github.io/cv.html",
      "https://erinemcc.github.io/research.html"
    ];

    const btn = document.getElementById("randomNavBtn");
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const i = Math.floor(Math.random() * randomUrls.length);
      window.location.href = randomUrls[i];
    });
  </script>

</body>
</html>
