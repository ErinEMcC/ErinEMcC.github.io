<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoPE</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 300px 300px;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 5vh 0;
      box-sizing: border-box;
    }

    .pdf-shell {
      width: min(1000px, 92vw);
      height: 85vh;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* Use iframe for widest compatibility */
    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .fallback {
      width: min(1000px, 92vw);
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      padding: 14px 16px;
      box-sizing: border-box;
      font-size: 0.95rem;
      color: #2d2d2d;
    }

    .fallback a {
      color: #1a4fb3;
      text-decoration: none;
      border-bottom: 1px solid rgba(26,79,179,0.35);
    }
    .fallback a:hover { border-bottom-color: rgba(26,79,179,0.9); }
  </style>
</head>

<body>
  <div class="pdf-shell" aria-label="CoPE PDF viewer">
    <!-- #view=FitH tends to open in a nice “fit to width” view -->
    <iframe
      class="pdf-frame"
      src="assets/cope.pdf#view=FitH"
      title="CoPE PDF"
      loading="lazy">
    </iframe>
  </div>

  <div class="fallback">
    If the PDF doesn’t render here (common on some phones), open it directly:
    <a href="assets/cope.pdf" target="_blank" rel="noopener">assets/CoPE 02 Booklet ERIN-2.pdf</a>
  </div>
</body>
</html>
