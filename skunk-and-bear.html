<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skunk and Bear</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: url('assets/transparency-grid.jpg') repeat;
      background-size: 300px 300px;
      font-family: Georgia, serif;
      color: #2d2d2d;
      line-height: 1.7;

      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 5vh 6vw;
    }

    /* Page-relative wrapper */
    .page-wrap {
      width: 90vw;
      max-width: 1400px;
      min-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .audio-wrapper {
      background: #ffffff;
      padding: 1rem 1.25rem;
      border-radius: 12px;
    }

    .audio-label {
      margin: 0 0 0.5rem 0;
      font-weight: bold;
    }

    /* OPEN BOOK */
    .story-container {
      position: relative;

      width: 100%;
      height: 72vh;
      max-height: 900px;
      min-height: 520px;

      padding: 2.5rem 3rem;
      background: #ffffff;

      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);

      overflow-y: auto;

      column-count: 2;
      column-gap: 6rem;
      column-rule: 1px solid rgba(0,0,0,0.10);
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 1rem 0;
      column-span: all;
    }

    p { margin: 0 0 1rem 0; }
    em { font-style: italic; }

    .story-container::-webkit-scrollbar { width: 8px; }
    .story-container::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    /* ===== Floating sidequest button ===== */
    .random-nav-btn {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 9999;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    }

    .random-nav-btn img {
      width: 125px;
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 160ms ease;
    }

    .random-nav-btn img:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .random-nav-btn img:active {
      transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .random-nav-btn img { transition: none; }
    }

    /* Responsive */
    @media (max-width: 900px) {
      body { padding: 4vh 3vw; }

      .page-wrap {
        width: 96vw;
        min-width: unset;
      }

      .story-container {
        column-count: 1;
        height: auto;
        padding: 1.75rem 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- Floating sidequest button -->
  <a href="#" class="random-nav-btn" id="randomNavBtn" aria-label="Sidequest">
    <img src="assets/sidequest.png" alt="Sidequest">
  </a>

  <div class="page-wrap">

    <div class="audio-wrapper">
      <p class="audio-label">🎧 Listen to the audio version:</p>
      <audio controls>
        <source src="assets/skunkNbear.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>
    
    <div class="story-container">
      <h1>Skunk and Bear</h1>

      <p>Like the girls she grew up with, Fi had spent most of her shapeshifting days in the sky as some bird or other...</p>
      <!-- (story text unchanged) -->
    </div>
  </div>

  <script>
    const randomUrls = [
      "https://erinemcc.github.io/aunt-rita.html",
      "https://erinemcc.github.io/bee-umwelt.html",
      "https://erinemcc.github.io/dog-star.html",
      "https://erinemcc.github.io/unicorns.html",
      "https://erinemcc.github.io/cope.html",
      "https://erinemcc.github.io/giraffe-fidl.html",
      "https://erinemcc.github.io/cv.html",
      "https://erinemcc.github.io/research.html"
    ];

    const btn = document.getElementById("randomNavBtn");
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const i = Math.floor(Math.random() * randomUrls.length);
      window.location.href = randomUrls[i];
    });
  </script>

</body>
</html>
