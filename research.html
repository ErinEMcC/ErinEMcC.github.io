<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Research</title>

  <style>
    body{
      margin: 0;
      padding: 0;
      background: #95BF0D; /* let the image bleed */
      font-family: Georgia, serif;
      min-height: 100vh;
    }

    .landing{
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: stretch;
      min-height: 100vh;
    }

    /* LEFT: big image */
    .hero{
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 3vw;
    }

    .hero img{
      max-height: 90vh;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* RIGHT: vertical links */
    /* RIGHT: paper strip behind the spines */
    .spine-nav{
      background: rgba(255,255,255,0.82);   /* off-white paper */
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;                           /* let the strip go full height */
      gap: 0;                               /* separators handle spacing */
      min-height: 100vh;                    /* full screen height */
    }
    
    /* Each “tab” */
    .spine-link{
      writing-mode: vertical-rl;            /* vertical text */
      transform: none;            /* flip direction like a book spine */
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #111;
    
      /* spacing */
      padding: 18px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    
      /* separators */
      border-left: 2px solid rgba(0,0,0,0.25);  /* thin line between tabs */
    }
    
    /* remove the very first divider line */
    .spine-link:first-child{
      border-left: none;
    }
    
    /* hover feels like “pulling a tab” */
    .spine-link:hover{
      background: rgba(255,255,255,0.95);
    }


    /* mobile: stack */
    @media (max-width: 900px){
      .landing{
        grid-template-columns: 1fr;
      }

      .spine-nav{
        justify-content: center;
        padding: 2rem 1rem;
      }

      .spine-link{
        writing-mode: horizontal-tb;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <div class="landing">

    <!-- IMAGE -->
    <div class="hero">
      <img src="assets/chladni_2.png" alt="Chladni figure illustration">
    </div>

    <!-- TEXT-ONLY LINKS -->
    <nav class="spine-nav">
      <a class="spine-link" href="https://doi.org/10.1002/nml.21532">Identifying essential nonprofits with a novel NLP Method</a>
      <a class="spine-link" href="https://youtu.be/sjQZOyIj2I0?si=QJB0U0aKpySHwUo0">Computational Antitrust Research Interview</a>
      <a class="spine-link" href="https://docs.google.com/presentation/d/e/2PACX-1vTXNuz97TbcRg6KOSoB6mmbeiHc5gEZ-qeUfxQGXtVfRbYCBWMGBlrf-xwlVKLnhQ/pub?start=false&loop=false&delayms=30000">Art/Research Presentation Slides</a>
      <a class="spine-link" href="https://doi.org/10.1162/99608f92.cc479d52">Convergence in Viral Outbreak Research</a>
    </nav>

  </div>

</body>
</html>
