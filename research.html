<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Research</title>

  <style>
    body{
      margin: 0;
      padding: 0;
      background: #95BF0D; /* let the image bleed */
      font-family: Georgia, serif;
      min-height: 100vh;
    }

    .landing{
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: stretch;
      min-height: 100vh;
    }

    /* LEFT: big image */
    .hero{
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 3vw;
    }

    .hero img{
      max-height: 90vh;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* RIGHT: vertical links */
    .spine-nav{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding: 3vw 2vw;
    }

    .spine-link{
      writing-mode: vertical-rl;
      transform: rotate(180deg); /* makes text read bottom → top */
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #111;
      background: rgba(255,255,255,0.7);
      padding: 14px 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .spine-link:hover{
      background: rgba(255,255,255,0.95);
      transform: rotate(180deg) translateY(-4px);
    }

    /* mobile: stack */
    @media (max-width: 900px){
      .landing{
        grid-template-columns: 1fr;
      }

      .spine-nav{
        justify-content: center;
        padding: 2rem 1rem;
      }

      .spine-link{
        writing-mode: horizontal-tb;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <div class="landing">

    <!-- IMAGE -->
    <div class="hero">
      <img src="assets/chladni_2.png" alt="Chladni figure illustration">
    </div>

    <!-- TEXT-ONLY LINKS -->
    <nav class="spine-nav">
      <a class="spine-link" href="#pub1">Featured Publication</a>
      <a class="spine-link" href="#pub2">Invited Talk</a>
      <a class="spine-link" href="#pub3">Peer-Reviewed Article</a>
      <a class="spine-link" href="#pub4">Collaborative Project</a>
    </nav>

  </div>

</body>
</html>
