<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Walking Magic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="video-wrapper">
      <video id="capybara" autoplay muted playsinline>
        <source src="assets/capybara_intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="image-section" id="jungle">
      <div class="drop-zone" id="dropZone"></div>
      <button id="resetJungle" class="reset-button">Reset Jungle</button>
    </div>
  </div>

  <div class="animal-bar">
    <img src="images/bear2.png" class="animal bear" data-url="bear.html" data-id="bear-a">
    <img src="images/bison2.png" class="animal bison" data-url="bison.html" data-id="bison-a">
    <img src="images/giraffe2.png" class="animal giraffe" data-url="giraffe.html" data-id="giraffe-c">
    <img src="images/bee2.png" class="animal bee" data-url="bee.html" data-id="bee-d">
    <img src="images/dog2.png" class="animal dog" data-url="dog.html" data-id="dog-e">
    <img src="images/elephant2.png" class="animal elephant" data-url="elephant.html" data-id="elegphant-f">
  </div>

  <script src="js/script.js"></script>
</body>
</html>
