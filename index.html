<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Erin-bo-berin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <div class="animal-bar">
      <img src="images/bison2.png" class="animal bison" data-url="aunt-rita.html" data-id="bison-a">
      <img src="images/giraffe2.png" class="animal giraffe" data-url="giraffe-fidl.html" data-id="giraffe-c">
      <img src="images/dog2.png" class="animal dog" data-url="dog-star.html" data-id="dog-e">
      <img src="images/elephant2.png" class="animal elephant" data-url="cope.html" data-id="elephant-f">
      <img src="images/bear2.png" class="animal bear" data-url="skunk-and-bear.html" data-id="bear-a">
      <img src="images/unicorn2.png" class="animal unicorn" data-url="unicorns.html" data-id="unicorn-g">
      <img src="images/butterfly2.png" class="animal butterfly" data-url="geheimnis.html" id="butterflyAnimal" style="display: none;">
    </div>

    <div class="container">
      <div class="video-wrapper">
        <video id="capybara" autoplay muted playsinline>
          <source src="assets/capybara_intro.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="image-section" id="jungle">
        <div class="drop-zone" id="dropZone"></div>

        <img src="assets/button-tulipwhite.png" alt="CV Button" title="cv" class="cv-button" id="cvButton">
        <img src="assets/button-tulipwhite.png" alt="Art Button" title="work" class="art-button" id="artButton">
        <img src="assets/button-tulipwhite.png" alt="Research Button" title="research" class="research-button" id="researchButton">

        <button id="resetJungle" class="reset-button">Reset Jungle</button>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
