<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Walking Magic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="video-wrapper">
      <video id="capybara" autoplay muted playsinline>
        <source src="assets/capybara_intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="image-section" id="jungle">
      <div class="drop-zone" id="dropZone"></div>
   
      <img src="assets/button-cv.png" alt="CV Button" class="cv-button" id="cvButton">
      <img src="assets/button-art.png" alt="Art Button" class="art-button" id="artButton">
      <img src="assets/button-research.png" alt="Research Button" class="research-button" id="researchButton">
      
      <button id="resetJungle" class="reset-button">Reset Jungle</button>
    </div>
  </div>

  <div class="animal-bar">
    <img src="images/bison2.png" class="animal bison" data-url="aunt-rita.html" data-id="bison-a">
    <img src="images/giraffe2.png" class="animal giraffe" data-url="giraffe-fidl.html" data-id="giraffe-c">
    <img src="images/dog2.png" class="animal dog" data-url="dog-star.html" data-id="dog-e">
    <img src="images/unicorn2.png" class="animal unicorn" data-url="cope.html" data-id="unicorn-e">
    <img src="images/bee2.png" class="animal bee" data-url="bee-umwelt.html" data-id="bee-d">
    <img src="images/bear2.png" class="animal bear" data-url="skunk-and-bear.html" data-id="bear-a">
    <img src="images/elephant2.png" class="animal elephant" data-url="elephant-mask.html" data-id="elegphant-f">
    <img src="images/butterfly2.png" class="animal butterfly" data-url="geheimnis.html" id="butterflyAnimal" style="display: none;">
  </div>

  <script src="js/script.js"></script>
</body>
</html>
